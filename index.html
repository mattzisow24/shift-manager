<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- "black" (opaque) instead of "black-translucent": translucent mode has a
     long-standing iOS bug in standalone PWAs where the viewport is shortened
     by the status-bar height, leaving a dead strip at the bottom -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Shift Manager">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Shift Manager</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
:root {
  --black: #1a1a1a;
  --black-mid: #2a2a2a;
  --black-light: #3a3a3a;
  --green-field: #52b788;
  --orange: #e8651a;
  --orange-light: #f07830;
  --amber: #f5b301;
  --blue: #4895ef;
  --white: #ffffff;
  --gray-light: #e9ecef;
  --gray: #adb5bd;
  --gray-dark: #6c757d;
  --red: #e63946;
  --green: #2ecc71;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif;
  background: var(--black);
  color: var(--white);
  overflow: hidden;
  height: 100vh;
  height: 100dvh;
  user-select: none;
  -webkit-user-select: none;
}

/* --- AUTH SCREEN --- */
.auth-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100dvh;
  padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
  gap: 20px;
  text-align: center;
}
.auth-screen.hidden { display: none; }
.auth-logo { height: 80px; }
.auth-title { font-size: 28px; font-weight: 700; }
.auth-subtitle { font-size: 14px; color: var(--gray); margin-top: -12px; }
.auth-btn {
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: white;
  color: #333;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.auth-btn:active { opacity: 0.8; }
.auth-error {
  color: var(--red);
  font-size: 13px;
  text-align: center;
  min-height: 18px;
  max-width: 360px;
}
.auth-logos { background: white; border-radius: 16px; padding: 14px 22px; }
.auth-logos img { height: 84px; width: auto; display: block; }
.join-input {
  width: 100%;
  max-width: 360px;
  padding: 14px 16px;
  border-radius: 10px;
  border: 2px solid rgba(255,255,255,0.2);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 1px;
  text-align: center;
  background: rgba(255,255,255,0.1);
  color: white;
}
.join-input::placeholder { color: rgba(255,255,255,0.4); letter-spacing: 0; font-weight: 600; }
.join-input:focus { outline: none; border-color: var(--orange); }
.auth-note { font-size: 13px; color: var(--gray); max-width: 320px; line-height: 1.4; }

/* --- APP WRAPPER --- */
/* Pinned to the physical screen edges: iOS standalone PWAs measure 100dvh
   unreliably, which left a dead strip under the footer */
.app-wrapper { display: none; position: fixed; inset: 0; flex-direction: column; }
.app-wrapper.active { display: flex; }

/* --- NAV / CLOCK HEADER --- */
.nav {
  display: flex;
  align-items: center;
  gap: 10px;
  /* keep the header below the iPhone status bar / Dynamic Island in standalone PWA mode */
  padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
  background: rgba(0,0,0,0.3);
  min-height: 48px;
  transition: background 0.2s;
}
.nav.paused { background: rgba(245,179,1,0.22); }
.nav.halftime { background: rgba(72,149,239,0.25); }
.nav.fulltime { background: rgba(255,255,255,0.10); }
.nav.warning { background: rgba(232,101,26,0.25); }
.nav.danger { background: rgba(230,57,70,0.30); }
#timer-clock {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
  cursor: pointer;
  min-width: 0;
}
.nav .timer-display { font-size: 30px; min-width: 0; letter-spacing: -0.5px; }
.clock-sub { font-size: 14px; font-weight: 700; color: white; white-space: nowrap; }
.clock-sub .clock-state { color: var(--amber); }
.clock-sub .clock-edit { color: var(--gray); font-weight: 400; font-size: 12px; }
.nav .timer-btn {
  width: 60px;
  height: 46px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
}
.nav .timer-btn svg { display: block; }
.nav .timer-btn:disabled { opacity: 0.35; }

/* --- SHIFT BANNER (shift change / halftime / full time) --- */
.shift-banner {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: var(--orange);
  color: white;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}
.shift-banner.show { display: flex; }
.shift-banner.halftime { background: var(--blue); }
.shift-banner.fulltime { background: var(--gray-dark); }
.shift-banner .banner-sub { font-size: 12px; font-weight: 600; opacity: 0.9; }
.shift-banner .banner-x { margin-left: auto; font-size: 20px; padding: 0 4px; opacity: 0.85; }

/* --- BOTTOM NAV --- */
.bottom-nav {
  display: flex;
  gap: 6px;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  background: #101010;
  border-top: 1px solid rgba(255,255,255,0.12);
  flex-shrink: 0;
}
.bottom-nav .nav-btn {
  flex: 1;
  padding: 13px 2px;
  border-radius: 10px;
  border: none;
  background: transparent;
  color: var(--gray);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  min-width: 0;
  position: relative;
}
.bottom-nav .nav-btn.active { background: var(--orange); color: white; }
.bottom-nav .nav-btn .nav-dot {
  position: absolute; top: 6px; right: 8px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--red); border: 2px solid #101010;
  display: none;
}
.bottom-nav .nav-btn.has-alert .nav-dot { display: block; }
/* Desktop: pre-game tabs sit in the bar and the ⋯ menu is hidden;
   the phone layout flips this (see the mobile media query) */
#more-btn { display: none; }

/* --- SCREENS --- */
.screen { display: none; overflow-y: auto; }
.screen.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }

/* --- ROSTER SCREEN --- */
.roster-screen { padding: 16px; gap: 12px; }
.roster-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.roster-header h2 { font-size: 20px; }
.add-player-row { display: flex; gap: 8px; }
.add-player-row input {
  flex: 1;
  padding: 10px 14px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
  background: rgba(255,255,255,0.15);
  color: white;
}
.add-player-row input::placeholder { color: rgba(255,255,255,0.5); }
.btn {
  padding: 10px 18px;
  border-radius: 8px;
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.btn-primary { background: var(--orange); color: white; }
.btn-danger { background: var(--red); color: white; }
.btn-gold { background: var(--orange); color: white; }
.btn-ghost { background: rgba(255,255,255,0.15); color: white; }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: 0.4; }

.setup-box {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(255,255,255,0.06);
}
.setup-box .setup-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--gray); width: 100%; }
.setup-box label { font-size: 13px; color: var(--gray); display: flex; align-items: center; gap: 6px; }
.setup-box select, .setup-box input[type="number"] {
  padding: 8px 10px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
  background: rgba(255,255,255,0.15);
  color: white;
  width: 72px;
}
.setup-box option { color: black; }
.setup-box .setup-note { font-size: 12px; color: var(--gray); width: 100%; }

.roster-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  grid-auto-rows: minmax(48px, 1fr);
  gap: 6px;
  flex: 1;
  overflow-y: auto;
  align-content: stretch;
}
.roster-empty {
  padding: 24px;
  border-radius: 12px;
  background: rgba(255,255,255,0.06);
  color: var(--gray);
  text-align: center;
  font-size: 15px;
  line-height: 1.5;
}
.roster-card {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  background: rgba(255,255,255,0.05);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.roster-card.checked-in {
  background: rgba(232,101,26,0.14);
  border-color: rgba(232,101,26,0.55);
}
.roster-check {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
  color: transparent;
}
.roster-card.checked-in .roster-check {
  background: var(--orange);
  border-color: var(--orange);
  color: white;
}
.roster-card:not(.checked-in) .roster-name { color: rgba(255,255,255,0.55); }
.roster-name { font-size: 15px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roster-delete {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.15);
  color: white;
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.roster-count { font-size: 14px; color: var(--gray); }

/* --- SHIFTS SCREEN --- */
.shifts-screen.active { display: flex; flex-direction: column; }
.shifts-top-bar {
  display: flex;
  align-items: stretch;
  gap: 8px;
  padding: 8px 12px;
  background: rgba(0,0,0,0.2);
}
.shift-rows { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.shift-row { display: flex; align-items: center; gap: 6px; }
.half-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--gray);
  width: 34px;
  flex-shrink: 0;
}
.shift-tab {
  flex: 1;
  min-width: 0;
  padding: 9px 4px;
  border-radius: 8px;
  border: 2px solid rgba(255,255,255,0.2);
  background: transparent;
  color: rgba(255,255,255,0.75);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  position: relative;
  white-space: nowrap;
}
.shift-tab.active { background: var(--orange); color: white; border-color: var(--orange); }
.shift-tab.live { border-color: var(--green); }
.shift-tab.live.active { border-color: white; }
.shift-tab .tab-live {
  position: absolute; top: -7px; left: 50%; transform: translateX(-50%);
  font-size: 8px; font-weight: 800; letter-spacing: 1px;
  padding: 1px 5px; border-radius: 6px;
  background: var(--green); color: #0b3d22;
}
.shift-tab .tab-alert {
  position: absolute; top: -5px; right: -5px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--red); border: 2px solid var(--black);
}
.lock-col { display: flex; flex-direction: column; justify-content: center; }
.lock-btn {
  padding: 8px 10px;
  border-radius: 8px;
  border: 2px solid rgba(255,255,255,0.2);
  background: transparent;
  color: var(--gray);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  height: 100%;
}
.lock-btn.locked {
  background: var(--red);
  border-color: var(--red);
  color: white;
}

.field-and-bench {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* --- STREAK BANNER (Shifts + Call Subs) --- */
.streak-banner {
  display: none;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 8px;
  padding: 10px 12px;
  background: rgba(230,57,70,0.28);
  border: 1px solid rgba(230,57,70,0.7);
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  margin: 8px 12px 0;
}
.streak-banner.show { display: flex; }
.streak-banner .streak-title { width: 100%; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #ffb3b9; }
.streak-chip {
  padding: 7px 12px;
  border-radius: 8px;
  background: var(--red);
  color: white;
  font-weight: 700;
  cursor: pointer;
  font-size: 14px;
}
.streak-chip .streak-n { font-weight: 500; opacity: 0.85; font-size: 12px; }
.streak-hint { width: 100%; font-size: 12px; color: #ffd4d8; font-weight: 500; }

/* --- FIELD --- */
.field-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px;
  position: relative;
}
.field {
  width: 100%;
  max-width: 600px;
  aspect-ratio: 1.4;
  background: linear-gradient(180deg, var(--green-field) 0%, #3da77a 100%);
  border-radius: 12px;
  border: 3px solid rgba(255,255,255,0.4);
  position: relative;
  overflow: hidden;
}
.field.placing { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(232,101,26,0.35); }
.field::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 10%;
  right: 10%;
  height: 2px;
  background: rgba(255,255,255,0.25);
  pointer-events: none;
}
.field::after {
  content: '';
  position: absolute;
  top: 25%;
  left: 30%;
  right: 30%;
  bottom: 25%;
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  pointer-events: none;
}

.field-slot {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 72px;
  min-height: 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  z-index: 10;
}
.field-slot .pos-label {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: rgba(255,255,255,0.7);
}
.field-slot .player-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  min-width: 64px;
  border: 2px dashed rgba(255,255,255,0.4);
  color: rgba(255,255,255,0.5);
  background: rgba(0,0,0,0.2);
  white-space: nowrap;
}
.field-slot .player-badge.filled {
  background: rgba(255,255,255,0.95);
  color: var(--black);
  border: 2px solid white;
}
.field.placing .field-slot .player-badge { outline: 2px dashed var(--orange); outline-offset: 2px; }
.field-slot.drag-over .player-badge {
  outline: 3px dashed var(--orange);
  outline-offset: 3px;
}
.field-slot.dragging { opacity: 0.4; }
.drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 200;
  padding: 6px 14px;
  border-radius: 10px;
  background: var(--orange);
  color: white;
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  transform: translate(-50%, -50%);
}

/* --- BENCH --- */
.bench-panel {
  width: 220px;
  background: rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  padding: 12px;
  gap: 6px;
  overflow-y: auto;
}
.bench-title {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--gray);
  margin-bottom: 4px;
}
.bench-title .bench-hint { color: var(--orange); text-transform: none; letter-spacing: 0; font-weight: 600; }
#bench-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.bench-player {
  padding: 8px 12px;
  border-radius: 8px;
  background: rgba(255,255,255,0.1);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
  border: 2px solid transparent;
}
.bench-player:active { background: rgba(255,255,255,0.25); }
.bench-player .bench-count {
  font-size: 11px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 6px;
  background: rgba(255,255,255,0.15);
  color: var(--gray-light);
}
.bench-player .bench-tag {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 1px 6px;
  border-radius: 6px;
}
.bench-player.sat-last { border-color: rgba(245,179,1,0.7); }
.bench-player.sat-last .bench-tag { background: var(--amber); color: #3a2a00; }
.bench-player.streak { border-color: var(--red); background: rgba(230,57,70,0.25); }
.bench-player.streak .bench-tag { background: var(--red); color: white; }
.bench-player.selected {
  background: var(--orange);
  border-color: var(--orange);
  color: white;
}
.bench-player.selected .bench-count { background: rgba(0,0,0,0.25); color: white; }
.bench-empty { font-size: 13px; color: var(--gray); font-style: italic; padding: 6px 2px; }

/* --- TRANSITIONS SCREEN --- */
.transitions-screen { padding: 16px; gap: 12px; overflow-y: auto; }
.transitions-screen h2 { font-size: 20px; }
.transition-section { margin-bottom: 12px; }
.transition-section h3 {
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid rgba(255,255,255,0.2);
}
.transition-section h3.subs { color: var(--green); }
.transition-section h3.stay { color: var(--gray); }
.transition-section h3.move { color: var(--orange); }
.transition-item {
  padding: 8px 14px;
  border-radius: 8px;
  margin-bottom: 4px;
  font-size: 16px;
  font-weight: 500;
}
.transition-item.stay { background: rgba(72,149,239,0.2); }
.transition-item.move { background: rgba(232,101,26,0.2); }
.transition-item.warn { background: rgba(230,57,70,0.35); font-weight: 700; }
.transition-arrow { color: var(--gray); font-size: 13px; }
.no-changes { color: var(--gray); font-style: italic; }
.sub-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 6px;
  background: rgba(255,255,255,0.05);
}
.sub-pair .sub-off, .sub-pair .sub-on { padding: 10px 12px; min-width: 0; }
.sub-pair .sub-off { background: rgba(230,57,70,0.25); }
.sub-pair .sub-on { background: rgba(46,204,113,0.22); }
.sub-pair .sub-tag { font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
.sub-pair .sub-off .sub-tag { color: #ff9aa3; }
.sub-pair .sub-on .sub-tag { color: #7ee0a4; }
.sub-pair .sub-name { font-size: 24px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.sub-pair .sub-pos { font-size: 12px; color: var(--gray-light); font-weight: 600; }
.sub-pair .sub-none { color: var(--gray); font-size: 14px; font-style: italic; }
.transition-stepper { display: flex; gap: 10px; align-items: stretch; }
.step-btn {
  width: 52px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.12);
  color: white;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
}
.step-btn:disabled { opacity: 0.25; }
.transition-label {
  flex: 1;
  text-align: center;
  background: rgba(255,255,255,0.07);
  border-radius: 10px;
  padding: 8px 12px;
  min-width: 0;
}
.transition-label-main { font-size: 18px; font-weight: 700; }
.transition-label-sub { font-size: 12px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; }
.now-chip {
  padding: 8px 14px;
  border-radius: 10px;
  border: 2px solid var(--orange);
  background: transparent;
  color: var(--orange);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  flex-shrink: 0;
}
.now-chip.following { background: var(--orange); color: white; }
.sub-countdown { font-size: 14px; color: var(--gray-light); font-weight: 600; font-variant-numeric: tabular-nums; }
.sub-countdown.window { color: var(--green); }
.callout-box {
  background: rgba(0,0,0,0.3);
  border-radius: 12px;
  padding: 16px;
  flex: 1;
  overflow-y: auto;
}
.callout-box .streak-banner { margin: 0 0 12px; }
.callout-big {
  font-size: 28px;
  font-weight: 700;
  line-height: 1.4;
  margin-bottom: 4px;
}

<body>

    <span class="sync-dot" id="sync-dot" title="Synced"></span>
  </nav>
  <div class="shift-banner" id="shift-banner">
    <div><div id="shift-banner-main"></div><div class="banner-sub" id="shift-banner-sub"></div></div>
    <span class="banner-x" id="shift-banner-x">&times;</span>
  </div>

  <div class="screen roster-screen" id="roster-screen">

  </div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// =====================================================================
// TEAMS
// No accounts. A coach types the team code once; the code (normalized) is
// the preset key and maps to a Firestore document, so knowing the code is
// what grants access.
// Adding a team = add a preset here and deploy.
// =====================================================================
const TEAM_PRESETS = {
  'riverplate': {
    name: 'River Plate',
    code: 'riverplate',
    docId: 'river-plate',   // the boys' existing Firestore document
    logo: 'logo.png',
    roster: [
      'John', 'Jibby', 'Justin', 'Charlie L', 'Charlie C', 'Emmet', 'Andrew', 'Angel',
      'Sam', 'Theo K', 'Theo F', 'Colby', 'Duanze', 'Eamon', 'Felipe', 'Guillermo',
      'Otto', 'Tom', 'David', 'Greyson'
    ],
  },
  'revolution': {
    name: 'Revolution',
    code: 'revolution',
    docId: 'revolution',
    logo: 'logo-revolution.png',
    roster: [
      'Addison', 'Alli', 'Anjali', 'Brooklynn', 'Elizabeth', 'Emilie', 'Emily', 'Emma',
      'Georgina', 'Grace', 'Harper', 'Ishani', 'Lavinia', 'Marley', 'Pippa', 'Saoirse',
      'Sara', 'Sylvia', 'Tess'
    ],
  },
};

// Alert when a player sits this many shifts in a row
const BENCH_STREAK_LIMIT = 2;
// After a shift boundary, Call Subs keeps showing the transition that just
// happened for this long (seconds) instead of jumping to the next one
const SUB_GRACE_SECONDS = 90;

// ---- FIREBASE INIT ----
firebase.initializeApp({
  apiKey: "AIzaSyBGRVuo3FN6kVBcfRO3ikzcGP1jDAL0h1o",
  authDomain: "river-plate-shift-manager.firebaseapp.com",
  projectId: "river-plate-shift-manager",
  storageBucket: "river-plate-shift-manager.firebasestorage.app",
  messagingSenderId: "301886559365",
  appId: "1:301886559365:web:4f1ad2f29fae9877c805ec"
});

const db = firebase.firestore();

// Enable Firestore offline persistence
db.enablePersistence({ synchronizeTabs: true }).catch(err => {
  console.log('Firestore persistence error:', err.code);
});

// ---- DEVICE ID (no accounts: writes are tagged with a per-phone id) ----
let deviceId = null;
try { deviceId = localStorage.getItem('shift-manager:device'); } catch {}
if (!deviceId) {
  deviceId = 'phone-' + Math.random().toString(36).slice(2, 10);
  try { localStorage.setItem('shift-manager:device', deviceId); } catch {}
}

// ---- TEAM CODES ----
const authScreen = document.getElementById('auth-screen');
const appWrapper = document.getElementById('app-wrapper');
const authError = document.getElementById('auth-error');
let currentTeam = null;

function normalizeCode(s) {
  return (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
}
function teamById(id) { const p = TEAM_PRESETS[id]; return p ? { id, ...p } : null; }
function joinedTeamIds() {
  try { return (JSON.parse(localStorage.getItem('shift-manager:joined')) || []).filter(id => TEAM_PRESETS[id]); } catch { return []; }
}
function rememberJoined(id) {
  const ids = joinedTeamIds().filter(x => x !== id); ids.push(id);
  try { localStorage.setItem('shift-manager:joined', JSON.stringify(ids)); } catch {}
}
function forgetJoined(id) {
  try { localStorage.setItem('shift-manager:joined', JSON.stringify(joinedTeamIds().filter(x => x !== id))); } catch {}
}

function showJoinScreen(msg) {
  leaveTeam();
  authError.textContent = msg || '';
  authScreen.classList.remove('hidden');
  appWrapper.classList.remove('active');
}

function joinTeam(id) {
  const team = teamById(id);
  if (!team) return false;
  rememberJoined(id);
  authError.textContent = '';
  authScreen.classList.add('hidden');
  appWrapper.classList.add('active');
  enterTeam(team);
  return true;
}

document.getElementById('join-btn').addEventListener('click', () => {
  const input = document.getElementById('join-code');
  const id = normalizeCode(input.value);
  if (!id) { authError.textContent = 'Type the team code first'; return; }
  if (!joinTeam(id)) { authError.textContent = 'No team with that code — check with your head coach'; return; }
  input.value = '';
  input.blur();
  showScreen('shifts');
  toast(`Welcome to ${TEAM_PRESETS[id].name}`);
});
document.getElementById('join-code').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('join-btn').click(); });

// ---- SYNC STATUS ----
function setSyncStatus(status) {
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot' + (status === 'offline' ? ' offline' : status === 'syncing' ? ' syncing' : '');
  dot.title = status === 'offline' ? 'Offline' : status === 'syncing' ? 'Syncing...' : 'Synced';
}

// ---- STATE ----
let state = defaultState();

function defaultState() {
  return {
    roster: [],
    checkedIn: [],
    halves: 2,
    shiftsPerHalf: 3,
    minutesPerHalf: 35,
    shifts: {},
    midShiftSubs: {},
    locked: false,
    // Game clock. Elapsed seconds = clockBase + (now - clockStartedAt) while
    // running. Both are shared, so every phone shows the same clock and a
    // reload never loses it.
    clockBase: 0,        // seconds elapsed as of the last pause/sync
    clockStartedAt: 0,   // epoch ms when play was tapped; 0 = paused
  };
}

// Which shift tab is open — per phone, not shared (so one coach browsing
// shift 5 doesn't yank everyone else's screen there)
let currentShiftIndex = 0;

// Migrate docs written by older versions of the app
function normalizeState(data) {
  const s = { ...defaultState(), ...data };
  if (data && data.clockBase === undefined && typeof data.timerElapsed === 'number') {
    s.clockBase = data.timerElapsed;
  }
  delete s.timerElapsed;
  delete s.currentShiftIndex;
  if (!s.midShiftSubs) s.midShiftSubs = {};
  if (!s.shifts) s.shifts = {};
  return s;
}

function docFromState() {
  return {
    roster: state.roster,
    checkedIn: state.checkedIn,
    halves: state.halves,
    shiftsPerHalf: state.shiftsPerHalf,
    minutesPerHalf: state.minutesPerHalf,
    shifts: state.shifts,
    midShiftSubs: state.midShiftSubs || {},
    locked: !!state.locked,
    clockBase: state.clockBase || 0,
    clockStartedAt: state.clockStartedAt || 0,
  };
}

// ---- PERSISTENCE ----
// Writes are field-level patches (dotted Firestore paths), so two coaches
// editing different things at the same time merge instead of overwriting
// each other's whole document.
let teamDoc = null;
let unsubscribeListener = null;
let pendingPatch = {};
let flushTimer = null;

function localKey(suffix) { return `shift-manager:${currentTeam ? currentTeam.id : 'none'}:${suffix}`; }

function persist(patch, opts = {}) {
  Object.assign(pendingPatch, patch);
  try { localStorage.setItem(localKey('state'), JSON.stringify(state)); } catch {}
  clearTimeout(flushTimer);
  if (opts.immediate) flushPatch();
  else flushTimer = setTimeout(flushPatch, 400);
}

function flushPatch() {
  clearTimeout(flushTimer);
  flushTimer = null;
  if (!teamDoc) return;
  const patch = pendingPatch;
  pendingPatch = {};
  if (Object.keys(patch).length === 0) return;
  setSyncStatus('syncing');
  teamDoc.update({
    ...patch,
    updatedBy: deviceId,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  }).then(() => setSyncStatus('online')).catch(err => {
    if (err && err.code === 'not-found') {
      teamDoc.set({ ...docFromState(), updatedBy: deviceId, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
        .then(() => setSyncStatus('online')).catch(() => setSyncStatus('offline'));
    } else {
      console.log('Firestore write error:', err);
      setSyncStatus('offline');
    }
  });
}

// Convenience savers
function saveShift(i) { persist({ [`shifts.${shiftKey(i)}`]: state.shifts[shiftKey(i)] || {} }); }
function saveFields(...keys) { const p = {}; keys.forEach(k => { p[k] = state[k]; }); persist(p); }
function saveClock() { persist({ clockBase: state.clockBase, clockStartedAt: state.clockStartedAt }, { immediate: true }); }

function applyPatchToState(patch) {
  Object.entries(patch).forEach(([path, value]) => {
    const parts = path.split('.');
    let obj = state;
    for (let i = 0; i < parts.length - 1; i++) {
      if (typeof obj[parts[i]] !== 'object' || obj[parts[i]] === null) obj[parts[i]] = {};
      obj = obj[parts[i]];
    }
    obj[parts[parts.length - 1]] = value;
  });
}

function leaveTeam() {
  if (unsubscribeListener) { unsubscribeListener(); unsubscribeListener = null; }
  clearTimeout(flushTimer);
  pendingPatch = {};
  teamDoc = null;
  currentTeam = null;
}

function enterTeam(team) {
  leaveTeam();
  currentTeam = team;
  teamDoc = db.collection('teams').doc(team.docId || team.id);
  try { localStorage.setItem('shift-manager:last-team', team.id); } catch {}
  document.getElementById('nav-logo').src = team.logo;
  currentShiftIndex = parseInt(localStorage.getItem(localKey('shift'))) || 0;
  state = defaultState();

  // Load from localStorage first for instant display. With no cache yet,
  // seed the preset roster so any write that races the first snapshot
  // (e.g. tapping play right after joining) carries a complete document.
  let cached = false;
  try {
    const local = JSON.parse(localStorage.getItem(localKey('state')));
    if (local && local.roster) { state = normalizeState(local); cached = true; }
  } catch {}
  if (!cached) state.roster = [...team.roster];
  renderAll();

  // includeMetadataChanges so the sync dot turns green when a cached load is
  // confirmed by the server even though the data itself didn't change
  let lastApplied = null;
  unsubscribeListener = teamDoc.onSnapshot({ includeMetadataChanges: true }, doc => {
    // Our own local writes echo back with hasPendingWrites=true; skip those
    if (doc.metadata.hasPendingWrites) return;
    if (doc.exists) {
      const raw = JSON.stringify(doc.data());
      if (raw === lastApplied) { setSyncStatus(doc.metadata.fromCache ? 'offline' : 'online'); return; }
      lastApplied = raw;
      state = normalizeState(doc.data());
      // Re-apply edits made since the last flush so a remote snapshot never
      // wipes something the coach just tapped
      applyPatchToState(pendingPatch);
      try { localStorage.setItem(localKey('state'), JSON.stringify(state)); } catch {}
      setSyncStatus(doc.metadata.fromCache ? 'offline' : 'online');
      renderAll();
      // A brand-new team has no players yet: start on the roster screen
      if (state.roster.length === 0 && !document.getElementById('roster-screen').classList.contains('active')) showScreen('roster');
    } else {
      // Only trust "doesn't exist" from the server: an offline phone's cache
      // also says "no document", and creating one from that would overwrite
      // the real team data once it reconnects.
      if (doc.metadata.fromCache) { setSyncStatus('offline'); return; }
      // First time this team is opened — create the shared doc from the
      // current local state (preset roster, plus anything tapped so far)
      if (state.roster.length === 0) state.roster = [...team.roster];
      teamDoc.set({ ...docFromState(), updatedBy: deviceId, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
        .then(() => setSyncStatus('online')).catch(() => setSyncStatus('offline'));
      renderAll();
      if (state.roster.length === 0) showScreen('roster');
    }
  }, err => {
    console.log('Firestore listener error:', err);
    setSyncStatus('offline');
    if (err && err.code === 'permission-denied') toast('Could not open the team — try again with a connection');
  });
}

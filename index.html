// ---- SHIFT / PLAY HELPERS ----
function totalShifts() { return state.halves * state.shiftsPerHalf; }
function shiftKey(i) { return `shift_${i}`; }
function getShift(i) { return state.shifts[shiftKey(i)] || {}; }
function shiftIsEmpty(i) { return Object.keys(getShift(i)).length === 0; }
function shiftIsFull(i) { const s = getShift(i); return POSITIONS.every(p => s[p.id]); }
function halfOf(i) { return Math.floor(i / state.shiftsPerHalf); }
function halfName(h) { return h === 0 ? '1st Half' : '2nd Half'; }
function shiftDisplayName(i) { return `${halfName(halfOf(i))} · Shift ${(i % state.shiftsPerHalf) + 1}`; }
function shortShiftName(i) { return `H${halfOf(i) + 1} S${(i % state.shiftsPerHalf) + 1}`; }

// A player "played" shift i if they're in its lineup, or started it and went
// off as an in-shift sub (the entrant is already in the lineup by then).
function playedShift(name, i) {
  if (Object.values(getShift(i)).includes(name)) return true;
  const subs = (state.midShiftSubs || {})[shiftKey(i)] || [];
  return subs.some(s => s.off === name);
}

// Consecutive planned shifts ending at i (inclusive) that `name` sat out.
// An empty (unplanned) shift ends the count rather than adding to it.
function benchStreak(name, i) {
  let n = 0;
  for (let k = i; k >= 0; k--) {
    if (shiftIsEmpty(k)) break;
    if (playedShift(name, k)) break;
    n++;
  }
  return n;
}

// Checked-in players who would sit shift i as their Nth straight shift
function streakViolations(i) {
  if (i < 1 || shiftIsEmpty(i)) return [];
  return state.checkedIn.filter(n => benchStreak(n, i) >= BENCH_STREAK_LIMIT).sort((a, b) => a.localeCompare(b));
}
function satLastShift(name, i) { return i >= 1 && !shiftIsEmpty(i - 1) && benchStreak(name, i - 1) >= 1; }

// Planned shift credit per checked-in player (in-shift subs split a shift 0.5/0.5)
function plannedShifts() {
  const credit = {};
  state.checkedIn.forEach(n => { credit[n] = 0; });
  for (let i = 0; i < totalShifts(); i++) {
    Object.values(getShift(i)).forEach(n => { if (credit[n] !== undefined) credit[n]++; });
  }
  const allSubs = state.midShiftSubs || {};
  Object.keys(allSubs).forEach(k => {
    const idx = parseInt(k.split('_')[1]);
    if (isNaN(idx) || idx >= totalShifts()) return;
    allSubs[k].forEach(s => {
      if (credit[s.on] !== undefined) credit[s.on] -= 0.5;
      if (credit[s.off] !== undefined) credit[s.off] += 0.5;
    });
  });
  return credit;
}
function fmtShifts(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }

// Red dots on the bottom bar when any planned shift has a streak violation
function updateNavAlerts() {
  let any = false;
  for (let i = 1; i < totalShifts(); i++) if (shiftIsFull(i) && streakViolations(i).length) { any = true; break; }
  document.querySelectorAll('.bottom-nav .nav-btn[data-screen="shifts"], .bottom-nav .nav-btn[data-screen="transitions"]')
    .forEach(b => b.classList.toggle('has-alert', any));
}

// ---- ROSTER ----
let rosterEditMode = false;

function renderRoster() {
  const list = document.getElementById('roster-list');
  const count = document.getElementById('roster-count');
  document.getElementById('roster-team-name').textContent = currentTeam ? currentTeam.name : 'Team Roster';
  count.textContent = `${state.roster.length} players · ${state.checkedIn.length} checked in`;

  // Game setup controls
  const sph = document.getElementById('sph-select');
  const mph = document.getElementById('mph-input');
  sph.value = String(state.shiftsPerHalf);
  mph.value = String(state.minutesPerHalf);
  sph.disabled = mph.disabled = !!state.locked;
  document.getElementById('setup-note').textContent =
    `${totalShifts()} shifts of ${fmtShifts(Math.round((state.minutesPerHalf / state.shiftsPerHalf) * 10) / 10)} min` + (state.locked ? ' · unlock shifts to change' : '');

  if (state.roster.length === 0) {
    list.innerHTML = `<div class="roster-empty" style="grid-column:1/-1;">No players yet.<br>Tap <b>Edit Roster</b> to add the team.</div>`;
    return;
  }

  list.innerHTML = [...state.roster].sort((a, b) => a.localeCompare(b)).map(name => {
    const checked = state.checkedIn.includes(name);
    return `<div class="roster-card ${checked ? 'checked-in' : ''}" data-name="${esc(name)}">
      <div class="roster-check">✓</div>
      <div class="roster-name">${esc(name)}</div>
      ${rosterEditMode ? `<button class="roster-delete" data-del="${esc(name)}">x</button>` : ''}
    </div>`;
  }).join('');

  list.querySelectorAll('.roster-card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('.roster-delete')) return;
      const name = card.dataset.name;
      if (state.checkedIn.includes(name)) {
        state.checkedIn = state.checkedIn.filter(n => n !== name);
      } else {
        state.checkedIn.push(name);
      }
      saveFields('checkedIn');
      renderRoster();
    });
  });

  list.querySelectorAll('.roster-delete').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (editLocked()) return;
      const name = btn.dataset.del;
      askConfirm(`Remove ${name} from the roster?`, 'Also clears them out of any shift lineups.', 'Yes — remove', 'Cancel', () => {
        state.roster = state.roster.filter(n => n !== name);
        state.checkedIn = state.checkedIn.filter(n => n !== name);
        const patch = { roster: state.roster, checkedIn: state.checkedIn };
        Object.keys(state.shifts).forEach(k => {
          const shift = state.shifts[k];
          let touched = false;
          Object.keys(shift).forEach(pos => { if (shift[pos] === name) { delete shift[pos]; touched = true; } });
          if (touched) patch[`shifts.${k}`] = shift;
        });
        persist(patch);
        renderRoster();
        toast(`${name} removed from the roster`);
      });
    });
  });
}

document.getElementById('add-player-btn').addEventListener('click', addPlayer);
document.getElementById('new-player-input').addEventListener('keydown', e => { if (e.key === 'Enter') addPlayer(); });

function addPlayer() {
  const input = document.getElementById('new-player-input');
  const name = input.value.trim();
  if (!name) return;
  if (state.roster.includes(name)) { toast('Player already exists'); return; }
  state.roster.push(name);
  state.checkedIn.push(name);
  input.value = '';
  saveFields('roster', 'checkedIn');
  renderRoster();
  input.focus();
}

document.getElementById('roster-edit-btn').addEventListener('click', () => {
  rosterEditMode = !rosterEditMode;
  document.getElementById('add-player-row').style.display = rosterEditMode ? 'flex' : 'none';
  document.getElementById('roster-edit-btn').textContent = rosterEditMode ? 'Done' : 'Edit Roster';
  renderRoster();
  if (rosterEditMode) document.getElementById('new-player-input').focus();
});

document.getElementById('sph-select').addEventListener('change', e => {
  if (editLocked()) { renderRoster(); return; }
  state.shiftsPerHalf = parseInt(e.target.value);
  if (currentShiftIndex >= totalShifts()) setCurrentShift(totalShifts() - 1);
  saveFields('shiftsPerHalf');
  renderRoster();
});
document.getElementById('mph-input').addEventListener('change', e => {
  if (editLocked()) { renderRoster(); return; }
  state.minutesPerHalf = Math.max(10, Math.min(45, parseInt(e.target.value) || 35));
  saveFields('minutesPerHalf');
  renderRoster();
  updateClockUI();
});

document.getElementById('new-game-btn').addEventListener('click', () => {
  askConfirm('Start a new game?', 'Clears check-ins, all shift lineups, in-shift subs, and the clock, and unlocks shifts. The roster itself is kept.', 'Yes — new game', 'Cancel', () => {
    state.checkedIn = [];
    state.shifts = {};
    state.midShiftSubs = {};
    state.clockBase = 0;
    state.clockStartedAt = 0;
    state.locked = false;
    setCurrentShift(0);
    lastShiftSeen = -1;
    transitionFollowGame = true;
    hideShiftBanner();
    releaseWakeLock();
    persist({ checkedIn: [], shifts: {}, midShiftSubs: {}, clockBase: 0, clockStartedAt: 0, locked: false }, { immediate: true });
    renderAll();
    toast('New game — fresh slate, roster kept');
  });
});

document.getElementById('check-all-btn').addEventListener('click', () => {
  if (state.checkedIn.length === state.roster.length) {
    state.checkedIn = [];
  } else {
    state.checkedIn = [...state.roster];
  }
  saveFields('checkedIn');
  renderRoster();
});

// ---- SHIFTS ----
function setCurrentShift(i) {
  currentShiftIndex = Math.max(0, Math.min(totalShifts() - 1, i));
  try { localStorage.setItem(localKey('shift'), String(currentShiftIndex)); } catch {}
}

function renderShifts() {
  if (currentShiftIndex >= totalShifts()) setCurrentShift(totalShifts() - 1);
  renderShiftTabs();
  renderStreakBanner();
  renderField();
  renderBench();
  updateNavAlerts();
}

function renderShiftTabs() {
  const bar = document.getElementById('shifts-top-bar');
  const live = liveShiftIndex();
  let rows = '';
  for (let h = 0; h < state.halves; h++) {
    rows += `<div class="shift-row"><span class="half-label">${h === 0 ? '1st' : '2nd'}</span>`;
    for (let s = 0; s < state.shiftsPerHalf; s++) {
      const idx = h * state.shiftsPerHalf + s;
      const alert = shiftIsFull(idx) && streakViolations(idx).length > 0;
      rows += `<button class="shift-tab ${idx === currentShiftIndex ? 'active' : ''} ${idx === live ? 'live' : ''}" data-shift="${idx}">
        ${idx === live ? '<span class="tab-live">LIVE</span>' : ''}Shift ${s + 1}${alert ? '<span class="tab-alert"></span>' : ''}</button>`;
    }
    rows += `</div>`;
  }
  bar.innerHTML = `<div class="shift-rows">${rows}</div>
    <div class="lock-col"><button class="lock-btn ${state.locked ? 'locked' : ''}" id="lock-btn">${state.locked ? '\u{1F512}<br>Locked' : '\u{1F513}<br>Open'}</button></div>`;

  document.getElementById('lock-btn').addEventListener('click', () => {
    if (state.locked) {
      askConfirm('Unlock shifts for editing?', null, 'Yes — unlock', 'Cancel', () => {
        state.locked = false;
        toast('Shifts unlocked — edits allowed');
        saveFields('locked');
        renderShifts();
      });
    } else {
      state.locked = true;
      clearBenchSelection(false);
      toast('\u{1F512} Shifts locked — lineups are protected');
      saveFields('locked');
      renderShifts();
    }
  });

  bar.querySelectorAll('.shift-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      setCurrentShift(parseInt(tab.dataset.shift));
      clearBenchSelection(false);
      renderShifts();
    });
  });
}

// Red banner above the field once the shift is full and someone is still
// sitting for a 2nd straight shift
function renderStreakBanner() {
  const el = document.getElementById('shifts-streak-banner');
  const i = currentShiftIndex;
  const v = shiftIsFull(i) ? streakViolations(i) : [];
  if (v.length === 0) { el.classList.remove('show'); el.innerHTML = ''; return; }
  el.innerHTML = `<div class="streak-title">⚠️ Sitting ${BENCH_STREAK_LIMIT} shifts in a row</div>` +
    v.map(n => `<span class="streak-chip" data-name="${esc(n)}">${esc(n)} <span class="streak-n">· ${benchStreak(n, i)} straight</span></span>`).join('') +
    `<div class="streak-hint">Tap a name to put them on in this shift</div>`;
  el.classList.add('show');
  el.querySelectorAll('.streak-chip').forEach(chip => chip.addEventListener('click', () => {
    if (editLocked()) return;
    openSwapInModal(i, chip.dataset.name, () => renderShifts());
  }));
}

// "Put NAME on in shift i — who comes out?" Used by both streak banners.
function openSwapInModal(i, name, after) {
  const shift = getShift(i);
  const entries = Object.entries(shift).sort((a, b) => a[1].localeCompare(b[1]));
  const credit = plannedShifts();
  const openPos = POSITIONS.find(p => !shift[p.id]);
  let html = `<div class="modal-note">${esc(shiftDisplayName(i))}${state.locked ? ' · allowed while locked' : ''}</div>`;
  if (openPos) html += `<div class="modal-player full-row" data-pos="${openPos.id}" style="background:var(--green);color:#06301a;">Open spot: ${fullPos(openPos.id)}</div>`;
  html += entries.map(([pos, n]) =>
    `<div class="modal-player" data-pos="${pos}" data-out="${esc(n)}">${esc(n)} <span class="mp-meta">${fullPos(pos)} · ${fmtShifts(credit[n] || 0)} shifts</span></div>`).join('');
  const list = openModal(`Put ${name} on — who comes out?`, html);
  list.querySelectorAll('.modal-player').forEach(el => el.addEventListener('click', () => {
    if (!state.shifts[shiftKey(i)]) state.shifts[shiftKey(i)] = {};
    const s = state.shifts[shiftKey(i)];
    Object.keys(s).forEach(p => { if (s[p] === name) delete s[p]; });
    s[el.dataset.pos] = name;
    saveShift(i);
    closeModal();
    toast(el.dataset.out ? `${name} on for ${el.dataset.out} at ${el.dataset.pos.toUpperCase()}` : `${name} on at ${el.dataset.pos.toUpperCase()}`);
    if (after) after();
  }));
}

// ---- BENCH SELECTION (tap a bench player, then tap a spot) ----
let selectedBench = null;

function clearBenchSelection(rerender = true) {
  if (!selectedBench) return;
  selectedBench = null;
  if (rerender) { renderField(); renderBench(); }
}

function slotTapped(posId) {
  if (editLocked()) return;
  if (selectedBench) {
    const name = selectedBench;
    selectedBench = null;
    if (!state.shifts[shiftKey(currentShiftIndex)]) state.shifts[shiftKey(currentShiftIndex)] = {};
    const shift = state.shifts[shiftKey(currentShiftIndex)];
    const displaced = shift[posId];
    Object.keys(shift).forEach(k => { if (shift[k] === name) delete shift[k]; });
    shift[posId] = name;
    saveShift(currentShiftIndex);
    renderShifts();
    toast(displaced ? `${name} in at ${posId.toUpperCase()} · ${displaced} to the bench` : `${name} in at ${posId.toUpperCase()}`);
    return;
  }
  openAssignModal(posId);
}

// ---- DRAG & DROP STATE ----
let dragState = null; // { sourcePos, playerName, ghost, moved }
let dragJustFinished = false; // suppress click after a completed drag

function renderField() {
  const field = document.getElementById('field');
  const shift = getShift(currentShiftIndex);
  const subs = (state.midShiftSubs || {})[shiftKey(currentShiftIndex)] || [];
  const subByPos = {};
  subs.forEach(s => { subByPos[s.pos] = s; });
  field.classList.toggle('placing', !!selectedBench);

  field.innerHTML = POSITIONS.map(pos => {
    const player = shift[pos.id];
    const filledClass = player ? 'filled' : '';
    const sub = subByPos[pos.id];
    const subNote = (sub && player === sub.on) ? `<span class="sub-note">in for ${esc(sub.off)}</span>` : '';
    return `<div class="field-slot" style="left:${pos.x}%;top:${pos.y}%;" data-pos="${pos.id}">
      <span class="pos-label">${pos.label}</span>
      <span class="player-badge ${filledClass}">${player ? esc(player) : '—'}</span>
      ${subNote}
    </div>`;
  }).join('');

  field.querySelectorAll('.field-slot').forEach(slot => {
    // --- Touch drag ---
    slot.addEventListener('touchstart', e => {
      const posId = slot.dataset.pos;
      const player = getShift(currentShiftIndex)[posId];
      if (!player || state.locked || selectedBench) return; // only drag filled slots, never when locked
      const touch = e.touches[0];
      dragState = { sourcePos: posId, playerName: player, ghost: null, moved: false, startX: touch.clientX, startY: touch.clientY };
    }, { passive: true });

    slot.addEventListener('touchmove', e => {
      if (!dragState) return;
      const touch = e.touches[0];
      const dx = touch.clientX - dragState.startX;
      const dy = touch.clientY - dragState.startY;
      // Only start drag after 8px movement to distinguish from tap
      if (!dragState.moved && Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      e.preventDefault();
      dragState.moved = true;

      if (!dragState.ghost) {
        const ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        ghost.textContent = dragState.playerName;
        document.body.appendChild(ghost);
        dragState.ghost = ghost;
        slot.classList.add('dragging');
      }
      dragState.ghost.style.left = touch.clientX + 'px';
      dragState.ghost.style.top = touch.clientY + 'px';

      field.querySelectorAll('.field-slot').forEach(s => s.classList.remove('drag-over'));
      const target = document.elementFromPoint(touch.clientX, touch.clientY);
      const targetSlot = target && target.closest('.field-slot');
      if (targetSlot && targetSlot.dataset.pos !== dragState.sourcePos) {
        targetSlot.classList.add('drag-over');
      }
    }, { passive: false });

    slot.addEventListener('touchend', e => {
      if (!dragState) {
        e.preventDefault(); // prevent delayed click / ghost-click
        slotTapped(slot.dataset.pos);
        return;
      }
      if (!dragState.moved) {
        e.preventDefault();
        dragState = null;
        slotTapped(slot.dataset.pos);
        return;
      }
      e.preventDefault();
      const touch = e.changedTouches[0];
      const target = document.elementFromPoint(touch.clientX, touch.clientY);
      const targetSlot = target && target.closest('.field-slot');
      if (targetSlot && targetSlot.dataset.pos !== dragState.sourcePos) {
        completeDrop(dragState.sourcePos, targetSlot.dataset.pos);
      }
      cleanupDrag();
    });

    // Click handler — taps on desktop (touch taps are handled in touchend)
    slot.addEventListener('click', () => {
      if (dragJustFinished) { dragJustFinished = false; return; }
      slotTapped(slot.dataset.pos);
    });

    // --- Mouse drag ---
    slot.addEventListener('mousedown', e => {
      const posId = slot.dataset.pos;
      const player = getShift(currentShiftIndex)[posId];
      if (!player || state.locked || selectedBench) return;
      e.preventDefault();
      dragState = { sourcePos: posId, playerName: player, ghost: null, moved: false, startX: e.clientX, startY: e.clientY };

      function onMouseMove(e) {
        if (!dragState) return;
        const dx = e.clientX - dragState.startX;
        const dy = e.clientY - dragState.startY;
        if (!dragState.moved && Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        dragState.moved = true;
        if (!dragState.ghost) {
          const ghost = document.createElement('div');
          ghost.className = 'drag-ghost';
          ghost.textContent = dragState.playerName;
          document.body.appendChild(ghost);
          dragState.ghost = ghost;
          slot.classList.add('dragging');
        }
        dragState.ghost.style.left = e.clientX + 'px';
        dragState.ghost.style.top = e.clientY + 'px';
        field.querySelectorAll('.field-slot').forEach(s => s.classList.remove('drag-over'));
        const target = document.elementFromPoint(e.clientX, e.clientY);
        const ts = target && target.closest('.field-slot');
        if (ts && ts.dataset.pos !== dragState.sourcePos) ts.classList.add('drag-over');
      }

      function onMouseUp(e) {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
        if (!dragState) return;
        if (!dragState.moved) { dragState = null; return; } // click handler opens the modal
        const target = document.elementFromPoint(e.clientX, e.clientY);
        const ts = target && target.closest('.field-slot');
        if (ts && ts.dataset.pos !== dragState.sourcePos) completeDrop(dragState.sourcePos, ts.dataset.pos);
        cleanupDrag();
      }

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });
  });
}

// Drag a player onto another spot: they swap if it's occupied, otherwise the
// source spot opens up
function completeDrop(sourcePos, targetPos) {
  if (editLocked()) return;
  if (!state.shifts[shiftKey(currentShiftIndex)]) state.shifts[shiftKey(currentShiftIndex)] = {};
  const shift = state.shifts[shiftKey(currentShiftIndex)];
  const dragged = shift[sourcePos];
  const displaced = shift[targetPos];
  shift[targetPos] = dragged;
  if (displaced) shift[sourcePos] = displaced; else delete shift[sourcePos];
  saveShift(currentShiftIndex);
  renderShifts();
}

function cleanupDrag() {
  if (dragState && dragState.ghost) dragState.ghost.remove();
  document.querySelectorAll('.field-slot').forEach(s => s.classList.remove('dragging', 'drag-over'));
  dragJustFinished = true;
  dragState = null;
  setTimeout(() => { dragJustFinished = false; }, 50);
}

function renderBench() {
  const benchList = document.getElementById('bench-list');
  const benchTitle = document.getElementById('bench-title');
  const i = currentShiftIndex;
  const shift = getShift(i);
  const onField = new Set(Object.values(shift));
  const credit = plannedShifts();
  const full = shiftIsFull(i);
  const bench = state.checkedIn.filter(n => !onField.has(n)).sort((a, b) => {
    // Streak players first, then "sat last shift", then fewest planned shifts
    const sa = benchStreak(a, i - 1), sb = benchStreak(b, i - 1);
    if (sa !== sb) return sb - sa;
    if (credit[a] !== credit[b]) return credit[a] - credit[b];
    return a.localeCompare(b);
  });

  if (selectedBench && !bench.includes(selectedBench)) selectedBench = null;
  benchTitle.innerHTML = selectedBench
    ? `<span class="bench-hint">Tap a spot on the field for ${esc(selectedBench)}</span>`
    : `Bench (${bench.length})${state.checkedIn.length === 0 ? '' : ' · number = planned shifts'}`;

  if (state.checkedIn.length === 0) {
    benchList.innerHTML = `<div class="bench-empty">No one checked in — use Roster (⋯) first</div>`;
    return;
  }
  if (bench.length === 0) {
    benchList.innerHTML = `<div class="bench-empty">Everyone checked in is on the field</div>`;
    return;
  }

  benchList.innerHTML = bench.map(name => {
    const streak = full ? benchStreak(name, i) : 0;
    const violation = streak >= BENCH_STREAK_LIMIT;
    const satLast = !violation && satLastShift(name, i);
    const cls = violation ? 'streak' : satLast ? 'sat-last' : '';
    const tag = violation ? `<span class="bench-tag">${streak} straight</span>` : satLast ? `<span class="bench-tag">sat last</span>` : '';
    return `<div class="bench-player ${cls} ${selectedBench === name ? 'selected' : ''}" data-name="${esc(name)}">
      ${esc(name)} <span class="bench-count">${fmtShifts(credit[name] || 0)}</span>${tag}</div>`;
  }).join('');

  benchList.querySelectorAll('.bench-player').forEach(el => {
    el.addEventListener('click', () => {
      if (editLocked()) return;
      const name = el.dataset.name;
      selectedBench = selectedBench === name ? null : name;
      renderField();
      renderBench();
    });
  });
}

// Assign modal (tap a spot with nobody selected on the bench)
function openAssignModal(posId) {
  if (editLocked()) return;
  const i = currentShiftIndex;
  const pos = POSITIONS.find(p => p.id === posId);
  const shift = getShift(i);
  const currentPlayer = shift[posId];
  const credit = plannedShifts();
  const full = shiftIsFull(i);

  let html = '';
  if (currentPlayer) {
    html += `<div class="modal-player full-row" data-assign="" style="color:var(--red);">Remove ${esc(currentPlayer)}</div>`;
  }
  const posByName = {};
  Object.entries(shift).forEach(([k, v]) => { posByName[v] = k; });
  const benchNames = state.checkedIn.filter(n => !posByName[n]).sort((a, b) => {
    const sa = benchStreak(a, i - 1), sb = benchStreak(b, i - 1);
    if (sa !== sb) return sb - sa;
    if (credit[a] !== credit[b]) return credit[a] - credit[b];
    return a.localeCompare(b);
  });
  benchNames.forEach(name => {
    const streak = full ? benchStreak(name, i) : 0;
    const tag = streak >= BENCH_STREAK_LIMIT ? `<span class="mp-tag red">${streak} straight</span>`
      : satLastShift(name, i) ? `<span class="mp-tag amber">sat last</span>` : '';
    html += `<div class="modal-player" data-assign="${esc(name)}">${esc(name)}<span class="mp-meta">${fmtShifts(credit[name] || 0)} shifts${tag}</span></div>`;
  });
  const fieldNames = Object.keys(posByName).filter(n => n !== currentPlayer).sort((a, b) => a.localeCompare(b));
  if (fieldNames.length > 0) {
    html += `<div class="modal-divider">Already on the field — picking one moves them here</div>`;
    fieldNames.forEach(name => {
      html += `<div class="modal-player dimmed" data-assign="${esc(name)}">${esc(name)} <span class="mp-meta">(${posByName[name].toUpperCase()})</span></div>`;
    });
  }

  const list = openModal(`Assign ${pos.label}`, html);
  list.querySelectorAll('.modal-player').forEach(el => {
    el.addEventListener('click', () => {
      const name = el.dataset.assign;
      if (!state.shifts[shiftKey(i)]) state.shifts[shiftKey(i)] = {};
      const s = state.shifts[shiftKey(i)];
      if (name) {
        // If the spot is taken and the newcomer is on the field, swap the two
        const from = posByName[name];
        const occupant = s[posId];
        Object.keys(s).forEach(k => { if (s[k] === name) delete s[k]; });
        s[posId] = name;
        if (from && occupant && occupant !== name) s[from] = occupant;
      } else {
        delete s[posId];
      }
      saveShift(i);
      closeModal();
      renderShifts();
    });
  });
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

document.getElementById('clear-shift-btn').addEventListener('click', () => {
  if (editLocked()) return;
  askConfirm('Clear all players from this shift?', null, 'Yes — clear it', 'Cancel', () => {
    state.shifts[shiftKey(currentShiftIndex)] = {};
    clearBenchSelection(false);
    saveShift(currentShiftIndex);
    renderShifts();
  });
});

document.getElementById('copy-prev-btn').addEventListener('click', () => {
  if (editLocked()) return;
  if (currentShiftIndex === 0) { toast('No previous shift'); return; }
  const prev = getShift(currentShiftIndex - 1);
  if (Object.keys(prev).length === 0) { toast('Previous shift is empty'); return; }
  state.shifts[shiftKey(currentShiftIndex)] = { ...prev };
  clearBenchSelection(false);
  saveShift(currentShiftIndex);
  renderShifts();
  toast('Copied — swap in the bench players who sat');
});

// =====================================================================
// GAME CLOCK
// Shared: clockBase (seconds) + clockStartedAt (epoch ms, 0 = paused).
// The tick loop only re-renders; it never mutates state, so reloads,
// backgrounding, and other phones all agree on the time.
// =====================================================================
let tickInterval = null;
let lastShiftSeen = -1;

function shiftDuration() { return (state.minutesPerHalf / state.shiftsPerHalf) * 60; }
function halfLength() { return state.minutesPerHalf * 60; }
function gameLength() { return halfLength() * state.halves; }
function clockRunning() { return !!state.clockStartedAt; }
function clockElapsed() {
  const e = clockRunning() ? state.clockBase + (Date.now() - state.clockStartedAt) / 1000 : state.clockBase;
  return Math.max(0, Math.min(gameLength(), e));
}
function gameStarted() { return clockRunning() || state.clockBase > 0; }
function shiftAt(elapsed) { return Math.max(0, Math.min(Math.floor(elapsed / shiftDuration()), totalShifts() - 1)); }
// The shift the game clock says we're in, or null before kickoff
function liveShiftIndex() { return gameStarted() ? shiftAt(clockElapsed()) : null; }
// Shift used for in-shift subs: the live one during a game, else the tab you're looking at
function gameCurrentShiftIndex() { const l = liveShiftIndex(); return l === null ? currentShiftIndex : l; }
function isHalftime() { return !clockRunning() && state.halves > 1 && Math.abs(state.clockBase - halfLength()) < 0.5; }
function isFullTime() { return !clockRunning() && state.clockBase >= gameLength() - 0.5; }
function fmtClock(sec) { sec = Math.max(0, sec); return `${Math.floor(sec / 60)}:${Math.floor(sec % 60).toString().padStart(2, '0')}`; }

function startClock() {
  if (clockRunning()) return;
  if (isFullTime()) { toast('Full time — reset the clock (tap it) for a new game'); return; }
  unlockAudio();
  state.clockStartedAt = Date.now();
  lastShiftSeen = shiftAt(state.clockBase);
  saveClock();
  hideShiftBanner();
  requestWakeLock();
  ensureTicking();
  updateClockUI();
}

function pauseClock(atSeconds) {
  if (!clockRunning()) return;
  const e = atSeconds !== undefined ? atSeconds : clockElapsed();
  state.clockBase = Math.round(e * 10) / 10;
  state.clockStartedAt = 0;
  saveClock();
  releaseWakeLock();
  updateClockUI();
}

function resetClock() {
  state.clockBase = 0;
  state.clockStartedAt = 0;
  lastShiftSeen = -1;
  saveClock();
  releaseWakeLock();
  hideShiftBanner();
  updateClockUI();
}

document.getElementById('timer-start-btn').addEventListener('click', () => {
  if (clockRunning()) {
    // Pausing mid-play is easy to hit by accident, so confirm it
    askConfirm('Pause the game clock?', 'The clock keeps running for the ref — only pause for a real stoppage.', 'Yes — pause', 'Keep running', () => {
      pauseClock();
      toast('Clock paused');
    });
  } else {
    startClock();
  }
});

function ensureTicking() {
  if (tickInterval) return;
  tickInterval = setInterval(tick, 250);
}

function tick() {
  if (!clockRunning()) { updateClockUI(); return; }
  const e = clockElapsed();
  // Auto-pause at the end of a half, exactly on the boundary
  const startHalf = Math.min(state.halves - 1, Math.floor(state.clockBase / halfLength()));
  const halfEnd = (startHalf + 1) * halfLength();
  if (e >= halfEnd) {
    pauseClock(halfEnd);
    beep(3);
    if (halfEnd >= gameLength()) showShiftBanner('fulltime', 'Full time', 'Tap the clock to reset for the next game');
    else showShiftBanner('halftime', 'Halftime', 'Tap ▶ when the 2nd half kicks off');
    renderIfActive('transitions');
    return;
  }
  const s = shiftAt(e);
  if (s !== lastShiftSeen) {
    const prev = lastShiftSeen;
    lastShiftSeen = s;
    if (prev >= 0 && s > prev) {
      beep(3);
      showShiftBanner('shift', `Shift ${(s % state.shiftsPerHalf) + 1} — call subs`, 'Tap to open Call Subs', () => showScreen('transitions'));
      renderIfActive('shifts');
      renderIfActive('transitions');
    }
  }
  updateClockUI();
}

function renderIfActive(key) {
  const el = document.getElementById(screens[key]);
  if (el && el.classList.contains('active')) {
    if (key === 'shifts') renderShifts();
    if (key === 'transitions') renderTransitions();
  }
}

function updateClockUI() {
  const display = document.getElementById('timer-display');
  const label = document.getElementById('timer-label');
  const nav = document.getElementById('nav');
  const btn = document.getElementById('timer-start-btn');
  const dur = shiftDuration();
  const e = clockElapsed();
  const running = clockRunning();
  const s = shiftAt(e);
  const shiftElapsed = e - s * dur;
  const remaining = Math.max(0, dur - shiftElapsed);

  nav.className = 'nav';
  display.className = 'timer-display';
  btn.disabled = false;

  if (!gameStarted()) {
    display.textContent = fmtClock(dur);
    label.innerHTML = `<span class="clock-state">Kickoff</span> · tap ▶ to start`;
  } else if (isFullTime()) {
    display.textContent = '0:00';
    label.innerHTML = `<span class="clock-state">Full time</span>`;
    nav.classList.add('fulltime');
    btn.disabled = true;
  } else if (isHalftime()) {
    display.textContent = fmtClock(dur);
    label.innerHTML = `<span class="clock-state">Halftime</span> · ▶ starts 2nd half`;
    nav.classList.add('halftime');
  } else {
    display.textContent = fmtClock(remaining);
    const where = `H${halfOf(s) + 1} · Shift ${(s % state.shiftsPerHalf) + 1}`;
    if (!running) {
      label.innerHTML = `<span class="clock-state">PAUSED</span> · ${where}`;
      nav.classList.add('paused');
    } else {
      label.textContent = `${where} · next sub`;
      if (remaining < 60 && remaining > 15) { display.classList.add('warning'); nav.classList.add('warning'); }
      if (remaining <= 15) { display.classList.add('danger'); nav.classList.add('danger'); }
    }
  }
  label.innerHTML += ' <span class="clock-edit">&#9998;</span>';

  // Play / pause button
  if (running) {
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 14 14" fill="currentColor"><rect x="2.2" y="1.5" width="3.6" height="11" rx="1.3"/><rect x="8.2" y="1.5" width="3.6" height="11" rx="1.3"/></svg>';
    btn.className = 'timer-btn pause';
    btn.title = 'Pause the game clock';
  } else {
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 14 14" fill="currentColor"><path d="M3.5 1.8v10.4a.6.6 0 0 0 .92.5l8.16-5.2a.6.6 0 0 0 0-1L4.42 1.3a.6.6 0 0 0-.92.5z"/></svg>';
    btn.className = 'timer-btn start';
    btn.title = 'Start the game clock';
  }

  // Keep Call Subs in sync with the game clock while that screen is open
  const transScreen = document.getElementById('transitions-screen');
  if (transScreen.classList.contains('active')) {
    updateSubCountdown();
    if (transitionFollowGame && selectedTransition !== upcomingTransition()) renderTransitions();
  }
}

// Remote snapshots can start/stop the clock from another phone; keep the tick
// loop, wake lock and alarm bookkeeping in step with whatever state says
function syncClockSideEffects() {
  if (clockRunning()) {
    ensureTicking();
    requestWakeLock();
    if (lastShiftSeen < 0) lastShiftSeen = shiftAt(clockElapsed());
  } else {
    releaseWakeLock();
  }
}
const _renderAllInner = renderAll;
renderAll = function () { syncClockSideEffects(); _renderAllInner(); };

// ---- SHIFT BANNER ----
let bannerTimeout = null;
function showShiftBanner(kind, main, sub, onTap) {
  const el = document.getElementById('shift-banner');
  el.className = 'shift-banner show ' + kind;
  document.getElementById('shift-banner-main').textContent = main;
  document.getElementById('shift-banner-sub').textContent = sub || '';
  el.onclick = e => { if (e.target.id === 'shift-banner-x') { hideShiftBanner(); return; } if (onTap) { hideShiftBanner(); onTap(); } };
  clearTimeout(bannerTimeout);
  if (kind === 'shift') bannerTimeout = setTimeout(hideShiftBanner, 45000);
}
function hideShiftBanner() {
  clearTimeout(bannerTimeout);
  const el = document.getElementById('shift-banner');
  el.className = 'shift-banner';
}

// ---- AUDIO (unlocked from the play tap so iOS lets it sound later) ----
let audioCtx = null;
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    // A silent blip keeps iOS from re-suspending the context
    const buf = audioCtx.createBuffer(1, 1, 22050);
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.connect(audioCtx.destination); src.start(0);
  } catch {}
}
function beep(n) {
  try {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    for (let i = 0; i < n; i++) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 880;
      gain.gain.value = 0.3;
      osc.start(audioCtx.currentTime + i * 0.2);
      osc.stop(audioCtx.currentTime + i * 0.2 + 0.15);
    }
  } catch {}
}

// ---- WAKE LOCK (screen stays on while the clock runs) ----
let wakeLock = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator) || wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (err) { wakeLock = null; }
}
function releaseWakeLock() {
  if (wakeLock) { try { wakeLock.release(); } catch {} wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (clockRunning()) requestWakeLock();
    updateClockUI();
    renderActiveScreen();
  }
});

// ---- TRANSITIONS (Call Subs) ----
// The screen follows the game clock by default: it auto-selects the transition
// into the UPCOMING shift, but for SUB_GRACE_SECONDS after a boundary it stays
// on the transition that just happened so the callout doesn't vanish mid-read.
let transitionFollowGame = true;
let selectedTransition = 1;

function upcomingTransition() {
  const total = totalShifts();
  if (!gameStarted()) return Math.max(1, Math.min(currentShiftIndex + 1, total - 1));
  const e = clockElapsed();
  const dur = shiftDuration();
  const cur = shiftAt(e);
  const sinceBoundary = e - cur * dur;
  let t = (cur >= 1 && sinceBoundary < SUB_GRACE_SECONDS) ? cur : cur + 1;
  return Math.max(1, Math.min(t, total - 1));
}
function inSubWindow() {
  if (!gameStarted()) return false;
  const e = clockElapsed();
  const cur = shiftAt(e);
  return cur >= 1 && (e - cur * shiftDuration()) < SUB_GRACE_SECONDS;
}

function transitionLabel(i) {
  const inHalf = i % state.shiftsPerHalf;
  if (inHalf === 0) return { main: 'Halftime', sub: 'into 2nd Half · Shift 1' };
  return { main: `Shift ${inHalf} → ${inHalf + 1}`, sub: halfName(halfOf(i)) };
}

function renderTransitions() {
  if (totalShifts() < 2) return;
  if (transitionFollowGame) selectedTransition = upcomingTransition();
  selectedTransition = Math.max(1, Math.min(selectedTransition, totalShifts() - 1));
  const lbl = transitionLabel(selectedTransition);
  const isNext = gameStarted() && selectedTransition === upcomingTransition();
  document.getElementById('transition-label-main').textContent = lbl.main;
  document.getElementById('transition-label-sub').textContent = lbl.sub + (isNext ? (inSubWindow() ? ' · now' : ' · up next') : '');
  document.getElementById('trans-prev').disabled = selectedTransition <= 1;
  document.getElementById('trans-next').disabled = selectedTransition >= totalShifts() - 1;
  const nowChip = document.getElementById('trans-now');
  nowChip.classList.toggle('following', transitionFollowGame);
  nowChip.innerHTML = transitionFollowGame ? '&#9679; LIVE' : 'GO LIVE';
  renderTransitionDetail(selectedTransition);
  updateSubCountdown();
  updateNavAlerts();
}

function updateSubCountdown() {
  const el = document.getElementById('sub-countdown');
  el.classList.remove('window');
  if (!gameStarted()) { el.textContent = 'Start the clock (▶ above) to follow the game'; return; }
  if (isFullTime()) { el.textContent = 'Full time'; return; }
  if (isHalftime()) { el.textContent = 'Halftime — make the halftime subs'; el.classList.add('window'); return; }
  const dur = shiftDuration();
  const e = clockElapsed();
  const cur = shiftAt(e);
  if (inSubWindow()) { el.textContent = 'Sub window — make these changes now'; el.classList.add('window'); return; }
  if (cur >= totalShifts() - 1) { el.textContent = 'Final shift — no subs left'; return; }
  el.textContent = `Next sub in ${fmtClock(dur * (cur + 1) - e)}` + (clockRunning() ? '' : ' (paused)');
}

document.getElementById('trans-prev').addEventListener('click', () => {
  transitionFollowGame = false;
  selectedTransition = Math.max(1, selectedTransition - 1);
  renderTransitions();
});
document.getElementById('trans-next').addEventListener('click', () => {
  transitionFollowGame = false;
  selectedTransition = Math.min(totalShifts() - 1, selectedTransition + 1);
  renderTransitions();
});
document.getElementById('trans-now').addEventListener('click', () => {
  transitionFollowGame = true;
  renderTransitions();
});

// Pair each player coming on with the player they replace. First by
// position (same spot vacated), then whoever is left, in order.
function computeTransition(prev, next) {
  const prevPos = {}, nextPos = {};
  Object.entries(prev).forEach(([p, n]) => { prevPos[n] = p; });
  Object.entries(next).forEach(([p, n]) => { nextPos[n] = p; });
  const comingOff = Object.keys(prevPos).filter(n => !nextPos[n]);
  const comingOn = POSITIONS.map(p => next[p.id]).filter(n => n && !prevPos[n]);
  const staying = Object.keys(prevPos).filter(n => nextPos[n]);
  const moving = staying.filter(n => prevPos[n] !== nextPos[n]);
  const same = staying.filter(n => prevPos[n] === nextPos[n]);

  const pairs = [];
  const usedOff = new Set();
  const unpairedOn = [];
  comingOn.forEach(n => {
    const p = nextPos[n];
    const was = prev[p];
    if (was && comingOff.includes(was) && !usedOff.has(was)) { pairs.push({ off: was, on: n, pos: p }); usedOff.add(was); }
    else unpairedOn.push(n);
  });
  const leftoverOff = comingOff.filter(n => !usedOff.has(n));
  unpairedOn.forEach(n => { pairs.push({ off: leftoverOff.shift() || null, on: n, pos: nextPos[n] }); });
  leftoverOff.forEach(n => pairs.push({ off: n, on: null, pos: prevPos[n] }));
  return { pairs, moving, same, prevPos, nextPos };
}

function renderTransitionDetail(toIndex) {
  const box = document.getElementById('callout-box');
  const prev = getShift(toIndex - 1);
  const next = getShift(toIndex);

  if (Object.keys(prev).length === 0 || Object.keys(next).length === 0) {
    box.innerHTML = `<div class="no-changes">Fill in ${shiftDisplayName(toIndex - 1)} and ${shiftDisplayName(toIndex)} on the Shifts tab to see this callout.</div>`;
    return;
  }

  const t = computeTransition(prev, next);
  let html = '';

  // Bench-streak alert for the shift we're subbing INTO
  const v = streakViolations(toIndex);
  if (v.length > 0) {
    html += `<div class="streak-banner show" id="trans-streak-banner">
      <div class="streak-title">⚠️ Sitting ${BENCH_STREAK_LIMIT} shifts in a row</div>
      ${v.map(n => `<span class="streak-chip" data-name="${esc(n)}">${esc(n)} <span class="streak-n">· ${benchStreak(n, toIndex)} straight</span></span>`).join('')}
      <div class="streak-hint">Tap a name to swap them into ${shiftDisplayName(toIndex)}</div>
    </div>`;
  }

  const openSpots = POSITIONS.filter(p => !next[p.id]);
  if (openSpots.length > 0) {
    html += `<div class="transition-section">
      <div class="transition-item warn">⚠️ ${openSpots.length} open spot${openSpots.length > 1 ? 's' : ''} in ${shiftDisplayName(toIndex)}: ${openSpots.map(p => fullPos(p.id)).join(', ')} — fill on the Shifts tab</div>
    </div>`;
  }

  if (t.pairs.length > 0) {
    html += `<div class="transition-section"><h3 class="subs">SUBS (${t.pairs.length})</h3>` +
      t.pairs.map(p => `<div class="sub-pair">
        <div class="sub-off"><div class="sub-tag">Off</div>${p.off ? `<div class="sub-name">${esc(p.off)}</div>` : `<div class="sub-none">nobody — spot was open</div>`}</div>
        <div class="sub-on"><div class="sub-tag">On</div>${p.on ? `<div class="sub-name">${esc(p.on)}</div><div class="sub-pos">${fullPos(p.pos)}</div>` : `<div class="sub-none">nobody — spot left open</div>`}</div>
      </div>`).join('') + `</div>`;
  }

  if (t.moving.length > 0) {
    html += `<div class="transition-section">
      <h3 class="move">SWITCHING POSITION (${t.moving.length})</h3>
      ${t.moving.map(n => `<div class="transition-item move callout-big">${esc(n)} <span class="transition-arrow">${fullPos(t.prevPos[n])} → ${fullPos(t.nextPos[n])}</span></div>`).join('')}
    </div>`;
  }

  if (t.same.length > 0) {
    html += `<div class="transition-section">
      <h3 class="stay">STAYING PUT (${t.same.length})</h3>
      <div class="transition-item stay">${t.same.map(n => `${esc(n)} <span class="transition-arrow">${t.prevPos[n].toUpperCase()}</span>`).join(' &nbsp;·&nbsp; ')}</div>
    </div>`;
  }

  if (!html) html = '<div class="no-changes">No differences between these shifts.</div>';
  box.innerHTML = html;

  box.querySelectorAll('#trans-streak-banner .streak-chip').forEach(chip => chip.addEventListener('click', () => {
    // Allowed while locked, like injury subs: this is a deliberate fix under time pressure
    openSwapInModal(toIndex, chip.dataset.name, () => renderTransitions());
  }));
}

// ---- MID-SHIFT (INJURY) SUBS ----
// Allowed even while shifts are locked — injuries don't wait for an unlock.
// Swaps the replacement into the current shift's lineup so the next sub
// callout is computed from who is actually on the field.
function openInjurySubModal() {
  const idx = gameCurrentShiftIndex();
  const shift = getShift(idx);
  const entries = Object.entries(shift);
  if (entries.length === 0) { toast(`No lineup set for ${shiftDisplayName(idx)}`); return; }

  const list = openModal('In-shift sub — who is going off?',
    `<div class="modal-note">Current shift: ${esc(shiftDisplayName(idx))}${state.locked ? ' · allowed while locked' : ''}</div>` +
    entries.sort((a, b) => a[1].localeCompare(b[1])).map(([pos, name]) =>
      `<div class="modal-player" data-off="${esc(name)}" data-pos="${pos}">${esc(name)} <span class="mp-meta">(${fullPos(pos)})</span></div>`
    ).join(''));

  list.querySelectorAll('.modal-player').forEach(el => {
    el.addEventListener('click', () => pickFillFor(idx, el.dataset.pos, el.dataset.off, [], { name: el.dataset.off, pos: el.dataset.pos }));
  });
}

// Ask who takes over `openPos`. The answer can be a bench player (done), an
// on-field player sliding over (which opens their old spot — recurse), or
// "leave the spot open".
function pickFillFor(idx, openPos, displacedName, moves, injured) {
  const shift = getShift(idx);
  const onField = new Set(Object.values(shift));
  const unavailable = new Set([injured.name, ...moves.map(m => m.player)]);
  const credit = plannedShifts();
  const bench = state.checkedIn.filter(n => !onField.has(n)).sort((a, b) => (credit[a] - credit[b]) || a.localeCompare(b));
  const fieldOptions = Object.entries(shift)
    .filter(([p, n]) => !unavailable.has(n) && p !== openPos)
    .sort((a, b) => a[1].localeCompare(b[1]));

  let html = `<div class="modal-note">${esc(displacedName)} is leaving ${fullPos(openPos)}</div>`;
  bench.forEach(n => {
    html += `<div class="modal-player" data-bench="${esc(n)}">${esc(n)}<span class="mp-meta">${fmtShifts(credit[n] || 0)} shifts</span></div>`;
  });
  if (fieldOptions.length > 0) {
    html += `<div class="modal-divider">Or slide over an on-field player</div>`;
    fieldOptions.forEach(([p, n]) => {
      html += `<div class="modal-player dimmed" data-field="${esc(n)}" data-frompos="${p}">${esc(n)} <span class="mp-meta">(from ${p.toUpperCase()})</span></div>`;
    });
  }
  html += `<div class="modal-player full-row" data-leave-open="1" style="color:var(--gray);">Leave ${fullPos(openPos)} open</div>`;
  const list = openModal(`Who takes ${fullPos(openPos)}?`, html);

  list.querySelectorAll('.modal-player').forEach(el => {
    el.addEventListener('click', () => {
      if (el.dataset.bench) {
        finalizeInjurySub(idx, injured, moves, { name: el.dataset.bench, pos: openPos });
      } else if (el.dataset.field) {
        pickFillFor(idx, el.dataset.frompos, el.dataset.field,
          [...moves, { player: el.dataset.field, from: el.dataset.frompos, to: openPos }], injured);
      } else {
        finalizeInjurySub(idx, injured, moves, null);
      }
    });
  });
}

function finalizeInjurySub(idx, injured, moves, entrant) {
  const key = shiftKey(idx);
  if (!state.shifts[key]) state.shifts[key] = {};
  const shift = state.shifts[key];
  delete shift[injured.pos];
  moves.forEach(m => { delete shift[m.from]; shift[m.to] = m.player; });
  if (entrant) shift[entrant.pos] = entrant.name;

  if (!state.midShiftSubs) state.midShiftSubs = {};
  if (!state.midShiftSubs[key]) state.midShiftSubs[key] = [];
  state.midShiftSubs[key].push({ off: injured.name, on: entrant ? entrant.name : '', pos: entrant ? entrant.pos : injured.pos });

  const parts = moves.map(m => `${m.player} → ${m.to.toUpperCase()}`);
  if (entrant) parts.push(`${entrant.name} on at ${entrant.pos.toUpperCase()}`);
  const summary = parts.length ? parts.join(', ') : 'spot left open';

  persist({ [`shifts.${key}`]: shift, [`midShiftSubs.${key}`]: state.midShiftSubs[key] });
  renderActiveScreen();

  const future = [];
  for (let i = idx + 1; i < totalShifts(); i++) {
    if (Object.values(getShift(i)).includes(injured.name)) future.push(i);
  }
  if (future.length > 0) {
    askConfirm(`Remove ${esc(injured.name)} from later shifts?`,
      `${esc(injured.name)} is still lined up in ${future.length} upcoming shift(s). Remove them and leave those spots open to refill?`,
      `Yes — remove from ${future.length} shift(s)`,
      'No — keep them in later shifts',
      () => {
        const patch = {};
        future.forEach(i => {
          const s = state.shifts[shiftKey(i)];
          Object.keys(s).forEach(p => { if (s[p] === injured.name) delete s[p]; });
          patch[`shifts.${shiftKey(i)}`] = s;
        });
        persist(patch);
        renderActiveScreen();
        toast(`${injured.name} off: ${summary} · removed from later shifts`);
      },
      () => toast(`${injured.name} off: ${summary}`));
  } else {
    closeModal();
    toast(`${injured.name} off: ${summary}`);
  }
}

document.querySelectorAll('.injury-sub-trigger').forEach(btn => {
  btn.addEventListener('click', openInjurySubModal);
});

// ---- CLOCK SYNC ----
// For when the ref started the game before the in-app timer: ask the ref how
// much time is left in the half and set the clock to match.
document.getElementById('timer-clock').addEventListener('click', () => {
  const e = clockElapsed();
  let half = e >= halfLength() ? 1 : 0;
  const leftNow = Math.max(0, halfLength() * (half + 1) - e);
  const list = openModal('Game clock', `
    <div class="modal-note" style="display:flex;gap:8px;">
      <button class="sync-half-btn" id="sync-h1">1st Half</button>
      <button class="sync-half-btn" id="sync-h2">2nd Half</button>
    </div>
    <div class="sync-time-row">
      <div style="display:flex;align-items:center;gap:10px;">
        <input class="sync-input" id="sync-min" type="number" inputmode="numeric" min="0" max="${state.minutesPerHalf}" value="${Math.floor(leftNow / 60)}">
        <span class="sync-colon">:</span>
        <input class="sync-input" id="sync-sec" type="number" inputmode="numeric" min="0" max="59" value="${Math.floor(leftNow % 60)}">
      </div>
      <div class="sync-caption">Time left in the half (ask the ref)</div>
    </div>
    <div class="modal-player full-row" id="sync-apply" style="background:var(--orange);text-align:center;justify-content:center;align-items:center;font-weight:700;">Sync &amp; Start Clock</div>
    <div class="modal-player full-row" id="sync-reset" style="background:transparent;color:var(--red);text-align:center;justify-content:center;align-items:center;font-size:14px;">Reset clock to 0:00</div>`);

  document.getElementById('sync-reset').addEventListener('click', () => {
    askConfirm('Reset the game clock to 0:00?', 'Use this before a new game, not mid-game.', 'Yes — reset', 'Cancel', () => {
      resetClock();
      toast('Clock reset');
    });
  });

  const paint = () => {
    document.getElementById('sync-h1').classList.toggle('selected', half === 0);
    document.getElementById('sync-h2').classList.toggle('selected', half === 1);
  };
  paint();
  document.getElementById('sync-h1').addEventListener('click', () => { half = 0; paint(); });
  document.getElementById('sync-h2').addEventListener('click', () => { half = 1; paint(); });

  document.getElementById('sync-apply').addEventListener('click', () => {
    const mins = Math.max(0, Math.min(state.minutesPerHalf, parseInt(document.getElementById('sync-min').value) || 0));
    const secs = Math.max(0, Math.min(59, parseInt(document.getElementById('sync-sec').value) || 0));
    const left = Math.min(halfLength(), mins * 60 + secs);
    state.clockBase = half * halfLength() + (halfLength() - left);
    state.clockStartedAt = 0;
    lastShiftSeen = shiftAt(state.clockBase); // don't replay old shift alarms
    closeModal();
    hideShiftBanner();
    if (left > 0) startClock(); else saveClock();
    updateClockUI();
    renderActiveScreen();
    toast(`Clock synced — ${mins}:${secs.toString().padStart(2, '0')} left in the ${half === 0 ? '1st' : '2nd'} half`);
  });
});

// ---- PLAYING TIME ----
function renderPlaytime() {
  const list = document.getElementById('playtime-list');
  const summary = document.getElementById('playtime-summary');
  const minutesPerShift = state.minutesPerHalf / state.shiftsPerHalf;
  const credit = plannedShifts();
  const maxShifts = totalShifts();

  if (state.checkedIn.length === 0) {
    list.innerHTML = `<div class="roster-empty">Nobody checked in yet.</div>`;
    summary.textContent = '';
    return;
  }

  const streakInfo = {};
  state.checkedIn.forEach(name => {
    let best = 0, endsAt = -1;
    for (let i = 0; i < maxShifts; i++) {
      const s = benchStreak(name, i);
      if (s > best) { best = s; endsAt = i; }
    }
    streakInfo[name] = { best, endsAt };
  });

  const sorted = state.checkedIn.slice().sort((a, b) => (credit[a] - credit[b]) || a.localeCompare(b));
  const vals = Object.values(credit);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  summary.textContent = `· ${sorted.length} players · ${fmtShifts(lo)}–${fmtShifts(hi)} of ${maxShifts} shifts`;

  list.innerHTML = sorted.map(name => {
    const shifts = credit[name];
    const mins = Math.round(shifts * minutesPerShift);
    const pct = maxShifts > 0 ? Math.round((shifts / maxShifts) * 100) : 0;
    let barClass = '';
    if (pct < 40) barClass = 'low';
    else if (pct < 65) barClass = 'mid';
    const st = streakInfo[name];
    const streakNote = st.best >= BENCH_STREAK_LIMIT
      ? `<div class="playtime-streak">⚠️ Sits ${st.best} in a row (${shortShiftName(st.endsAt - st.best + 1)}–${shortShiftName(st.endsAt)})</div>` : '';
    return `<div class="playtime-card ${st.best >= BENCH_STREAK_LIMIT ? 'streak' : ''}">
      <div class="playtime-row">
        <div class="playtime-name">${esc(name)}</div>
        <div class="playtime-meta">~${mins} min · ${pct}%</div>
        <div class="playtime-shifts">${fmtShifts(shifts)}<small> / ${maxShifts}</small></div>
      </div>
      <div class="playtime-bar-bg"><div class="playtime-bar ${barClass}" style="width:${pct}%"></div></div>
      ${streakNote}
    </div>`;
  }).join('');
}

// ---- HELPERS ----
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
const POS_FULL_NAMES = {
  gk: 'Goalkeeper', lb: 'Left Back', lcb: 'Left Center Back', rcb: 'Right Center Back',
  rb: 'Right Back', lm: 'Left Mid', cdm: 'Center Defensive Mid', rm: 'Right Mid',
  lw: 'Left Wing', st: 'Striker', rw: 'Right Wing'
};
function fullPos(id) { return POS_FULL_NAMES[id] || id.toUpperCase(); }

// ---- SERVICE WORKER ----
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    // A new version installed in the background: offer a reload (the clock
    // is shared state now, so reloading mid-game loses nothing)
    reg.addEventListener('updatefound', () => {
      const sw = reg.installing;
      if (!sw) return;
      sw.addEventListener('statechange', () => {
        if (sw.state === 'installed' && navigator.serviceWorker.controller) {
          toast('New version ready — tap to reload', { sticky: true, onClick: () => location.reload() });
        }
      });
    });
  }).catch(() => {});
}

// Keep the header fresh even before the first play tap (e.g. remote start)
ensureTicking();

// Boot: reopen the last team used on this phone, otherwise ask for a code
(function boot() {
  let last = null;
  try { last = localStorage.getItem('shift-manager:last-team'); } catch {}
  const ids = joinedTeamIds();
  const id = (last && ids.includes(last)) ? last : ids[ids.length - 1];
  if (id) joinTeam(id); else showJoinScreen();
})();
</script>
